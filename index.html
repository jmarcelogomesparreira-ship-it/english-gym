<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Gym</title>
<meta name="theme-color" content="#18202E">
<meta name="description" content="Treino diário de inglês: frases, palavras, verbos, flashcards, ditado e pronúncia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Gym">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#18202E; --muted:#5B6577; --line:#DDE2EA;
  --past:#5146D9; --pres:#0B8F7E; --fut:#B86F00; --ok:#1E8E3E; --bad:#C62D2D;
  --past-soft:#ECEBFF; --pres-soft:#E3F6F3; --fut-soft:#FFF3DE;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F131B; --surface:#182030; --ink:#E8ECF4; --muted:#98A2B5; --line:#2A3447;
    --past:#9C95FF; --pres:#3CC9B4; --fut:#F2B13D; --ok:#4CC46E; --bad:#F06A6A;
    --past-soft:#24234A; --pres-soft:#123631; --fut-soft:#3A2C10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131B; --surface:#182030; --ink:#E8ECF4; --muted:#98A2B5; --line:#2A3447;
  --past:#9C95FF; --pres:#3CC9B4; --fut:#F2B13D; --ok:#4CC46E; --bad:#F06A6A;
  --past-soft:#24234A; --pres-soft:#123631; --fut-soft:#3A2C10;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pres);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header */
.top{padding:22px 0 10px}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,2.8rem);line-height:1;margin:0;letter-spacing:-.02em}
.lanes{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 10px;max-width:220px}
.lanes span{flex:1}
.lanes span:nth-child(1){background:var(--past)}
.lanes span:nth-child(2){background:var(--pres)}
.lanes span:nth-child(3){background:var(--fut)}
.sub{color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;align-items:center}
.stat b{font-family:var(--display);font-size:1.3rem}
.stat span{color:var(--muted);font-size:.9rem;margin-left:4px}
.speed{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.92rem}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:14px 12px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

main{padding:18px 0 60px}
h2{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:4px 0 6px}
.hint{color:var(--muted);margin:0 0 14px;font-size:.95rem}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.search{flex:1 1 220px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.t0[aria-pressed="true"]{background:var(--past);border-color:var(--past);color:#fff}
.chip.t1[aria-pressed="true"]{background:var(--pres);border-color:var(--pres);color:#fff}
.chip.t2[aria-pressed="true"]{background:var(--fut);border-color:var(--fut);color:#fff}

/* verb list */
.vhead,.vrow{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.25fr;gap:8px;align-items:center}
.vhead{font-size:.85rem;font-weight:700;padding:0 14px 6px}
.vhead .c0{color:var(--muted)}
.c1{color:var(--pres)} .c2{color:var(--past)} .c3{color:var(--fut)}
.vlist{display:flex;flex-direction:column;gap:6px}
.verb{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vrow{width:100%;border:0;background:none;text-align:left;padding:12px 14px}
.vrow .pt{color:var(--muted);font-size:.92rem}
.vrow .f{font-weight:700}
.vrow .f.c1{color:var(--pres)} .vrow .f.c2{color:var(--past)} .vrow .f.c3{color:var(--fut)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px;background:var(--past-soft);color:var(--past)}
.hidden-past{display:inline-block;min-width:3.5em;border-bottom:2px dashed var(--past);color:transparent;user-select:none}
.mastered{color:var(--ok);font-size:.8rem;margin-left:4px}
.detail{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px}
.sent{display:flex;gap:10px;align-items:flex-start;border-left:4px solid;padding:6px 0 6px 12px;border-radius:2px}
.sent.t0{border-color:var(--past)} .sent.t1{border-color:var(--pres)} .sent.t2{border-color:var(--fut)}
.sent .en{font-size:1.05rem}
.sent .ptx{color:var(--muted);font-size:.92rem}
.sent b.t0{color:var(--past)} .sent b.t1{color:var(--pres)} .sent b.t2{color:var(--fut)}
.tw{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.note{font-size:.9rem;background:var(--fut-soft);padding:8px 12px;border-radius:10px}
.say{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;width:38px;height:38px;font-size:1rem;display:inline-grid;place-items:center}
.nosay .say,.nosay .speed,.nosay .listenbar{display:none}
.empty{padding:20px;text-align:center;color:var(--muted)}

/* training */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.q-label{color:var(--muted);font-size:.95rem;margin:0 0 6px}
.q-main{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,6vw,2rem);line-height:1.2;margin:0 0 4px}
.q-pt{font-size:1.25rem;margin:0 0 14px}
.answer{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1.15rem;margin:10px 0}
.answer.ok{border-color:var(--ok)} .answer.bad{border-color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.okb{background:var(--ok);color:#fff} .btn.badb{background:var(--bad);color:#fff}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:1.05rem}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg)}
.fb.ok{border-left:4px solid var(--ok)} .fb.bad{border-left:4px solid var(--bad)}
.fb p{margin:4px 0}
.progress{margin-top:16px;color:var(--muted);font-size:.92rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}

/* texts */
.reader{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;border-top:6px solid var(--pres)}
.reader.t0{border-top-color:var(--past)} .reader.t2{border-top-color:var(--fut)}
.reader h3{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0 0 12px}
.ttext{font-size:1.25rem;line-height:1.75;margin:0;max-width:62ch}
.w{cursor:pointer;border-radius:4px}
.w:hover{background:var(--bg)}
.vb{font-weight:700;padding:0 2px;border-radius:4px}
.t0 .vb{color:var(--past);background:var(--past-soft)}
.t1 .vb{color:var(--pres);background:var(--pres-soft)}
.t2 .vb{color:var(--fut);background:var(--fut-soft)}
.w.speaking{outline:2px solid currentColor}
.trans{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted);font-size:1.02rem;max-width:62ch}
.listenbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}

/* rules */
.rules{display:flex;flex-direction:column;gap:12px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.rule h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0 0 6px}
.rule p{margin:0 0 10px}
.ex{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:1.02rem}
.ex .mk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:.85rem}
.ex.no .mk{background:var(--bad)} .ex.yes .mk{background:var(--ok)}
.ex.no span.t{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.ex .say{width:32px;height:32px;margin-left:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.98rem;margin-top:4px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl th{font-size:.85rem}
.scroll{overflow-x:auto}

@media (max-width:560px){
  .vhead{display:none}
  .vrow{grid-template-columns:1fr 1fr 1.3fr;row-gap:2px}
  .vrow .pt{grid-column:1/-1}
  body{font-size:16px}
  .card,.reader{padding:18px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* hoje */
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.flame{font-family:var(--display);font-weight:800;font-size:clamp(3rem,13vw,4.4rem);line-height:.95;letter-spacing:-.03em}
.hero .lbl{font-weight:700;font-size:1.1rem}
.hero .msg{color:var(--muted);margin:2px 0 0}
.section{margin-top:24px}
h3.sh{font-family:var(--display);font-weight:600;font-size:1.12rem;margin:0 0 10px}
.goalbar{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin:4px 0 8px}
.goalbar i{display:block;height:100%;background:var(--pres);transition:width .3s}
.goalbar.full i{background:var(--ok)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.num b{display:block;font-family:var(--display);font-size:1.45rem;line-height:1.15}
.num span{color:var(--muted);font-size:.88rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:140px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 8px}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-height:0}
.wk .barbox{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.wk i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--line)}
.wk i.some{background:var(--pres)} .wk i.met{background:var(--ok)}
.wk small{font-size:.78rem;color:var(--muted)} .wk.today small{color:var(--ink);font-weight:700}
.wk em{font-style:normal;font-size:.72rem;color:var(--muted);min-height:1em}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.qa{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-weight:700;font-size:1.02rem}
.qa span{display:block;font-weight:400;color:var(--muted);font-size:.88rem;margin-top:2px}
.qa.t0{border-left:5px solid var(--past)} .qa.t1{border-left:5px solid var(--pres)} .qa.t2{border-left:5px solid var(--fut)} .qa.t3{border-left:5px solid var(--ink)}
.small{font-size:.88rem;color:var(--muted)}
.backup{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* flashcards */
.fc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:250px;display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc-front{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.2;margin:6px 0 12px}
.fc-back{border-top:1px dashed var(--line);padding-top:14px;margin-top:auto;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fc-en{font-size:1.3rem;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.forms{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 8px;font-weight:700;font-size:1.1rem}
.forms small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.deckinfo{color:var(--muted);font-size:.92rem;margin:-2px 0 12px}

/* frases e palavras */
.phr-list{display:flex;flex-direction:column;gap:6px}
.phr{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.phr .en{font-size:1.05rem;font-weight:700}
.phr .ptx{color:var(--muted);font-size:.92rem}
.phr.speaking{border-color:var(--pres);box-shadow:inset 4px 0 0 var(--pres)}
.cat-h{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:20px 0 8px;color:var(--muted)}
.cat-h:first-child{margin-top:4px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.wd{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.wd b{display:block;font-size:1.05rem}
.wd span{color:var(--muted);font-size:.9rem}
.wd .masked{display:inline-block;width:5em;border-bottom:2px dashed var(--line)}

/* ditado e pronúncia */
.miss{color:var(--bad);text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:4px}
.q-main.sm{font-size:clamp(1.25rem,5vw,1.6rem)}
.btn.mic.on{background:var(--bad);color:#fff}

/* ===== v3: layout de app no celular ===== */
.appbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.ab{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;flex-direction:column;gap:5px}
.brand b{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;line-height:1}
.brand .lanes{margin:0;height:4px;width:64px;order:2}
.pills{margin-left:auto;display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-weight:700;font-size:.9rem;white-space:nowrap}
.pill.hot{border-color:color-mix(in srgb,var(--fut) 45%,var(--line));background:var(--fut-soft)}
main{padding:16px 0 calc(96px + env(safe-area-inset-bottom,0px))}
h2{font-size:1.6rem;margin:2px 0 4px;letter-spacing:-.01em}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:0 auto;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
@media (min-width:761px){.bottomnav{bottom:12px;border:1px solid var(--line);border-radius:20px;padding-bottom:6px;box-shadow:0 6px 24px rgba(0,0,0,.08)}}
.nb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:14px;color:var(--muted);font-size:.74rem;font-weight:700;-webkit-tap-highlight-color:transparent}
.nb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="page"]{color:var(--ink)}
.nb[aria-current="page"] svg{stroke-width:2.3}
.nb[aria-current="page"]::before{content:"";width:28px;height:3px;border-radius:2px;background:var(--pres);margin:-6px 0 3px}
.nb:not([aria-current="page"])::before{content:"";height:3px;margin:-6px 0 3px}
/* linhas de chips deslizam pro lado em vez de quebrar */
.controls:not(:has(input)){flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:2px 16px;scroll-padding:16px}
.controls:not(:has(input))::-webkit-scrollbar{display:none}
.controls:not(:has(input)) > *{flex:none}
.chip{padding:9px 15px;font-weight:700;font-size:.93rem}
/* botões grandes pro polegar */
@media (max-width:560px){
  .btns{gap:10px}
  .btns .btn{flex:1 1 0;min-height:52px;font-size:1.02rem}
  .card,.fc,.reader{border-radius:20px}
  .fc{min-height:52vh}
  .fc-front{font-size:clamp(1.7rem,8vw,2.3rem)}
  .opt{min-height:56px;font-size:1.08rem}
  .answer{font-size:1.15rem;min-height:54px}
}
.btn{border-radius:14px}
/* hoje */
.hero2{background:var(--hero,#18202E);color:var(--hero-ink,#fff);border-radius:22px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero2 .row{display:flex;align-items:flex-end;gap:12px}
.hero2 .big{font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,17vw,4.8rem);line-height:.85;letter-spacing:-.04em}
.hero2 .lbl{font-weight:700;font-size:1.05rem;line-height:1.2;padding-bottom:4px}
.hero2 .msg{opacity:.75;margin:10px 0 14px;font-size:.95rem}
.hero2 .goalbar{background:rgba(255,255,255,.18);height:12px;margin:0 0 8px}
.hero2 .goalbar i{background:var(--pres)}
.hero2 .goalbar.full i{background:var(--ok)}
.hero2 .meta{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;opacity:.9}
.hero2 .lanes{position:absolute;top:20px;right:20px;margin:0;width:58px}
.quick{grid-template-columns:1fr 1fr}
.qa{display:flex;flex-direction:column;justify-content:space-between;min-height:96px;border-left:1px solid var(--line)!important;position:relative;padding:14px 14px 12px}
.qa::before{content:"";width:28px;height:4px;border-radius:2px;margin-bottom:12px;background:var(--ink)}
.qa.t0::before{background:var(--past)} .qa.t1::before{background:var(--pres)} .qa.t2::before{background:var(--fut)} .qa.t4::before{background:var(--bad)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero:#272B63;--hero-ink:#EEF0FF}}
:root[data-theme="dark"]{--hero:#272B63;--hero-ink:#EEF0FF}
@media (max-width:560px){.fc{min-height:38vh}}
.dirbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-weight:700;font-size:.82rem;color:var(--ink)}
.deckinfo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* mais */
.menu{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;width:100%}

function addDays(d,n){ const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return x.toLocaleDateString("en-CA"); }
function dayLog(d){ d=d||today(); return store.log[d]||(store.log[d]={sec:0,a:0}); }
function countAct(kind){ const L=dayLog(); L.a++; L[kind]=(L[kind]||0)+1; save(); }
function dayDone(d){ const L=store.log[d]; return !!L&&((L.a||0)>0||(L.sec||0)>=60); }
function streak(){ let d=today(),n=0; if(!dayDone(d)) d=addDays(d,-1); while(dayDone(d)){ n++; d=addDays(d,-1); } return n; }
function bestStreak(){ let best=0,run=0,prev=null; Object.keys(store.log).filter(dayDone).sort().forEach(d=>{ run=(prev&&addDays(prev,1)===d)?run+1:1; best=Math.max(best,run); prev=d; }); return best; }
function fmtMin(sec){ const m=Math.floor((sec||0)/60); return m<60?m+" min":Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"); }

const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let voice=null;
function pickVoice(){ if(!synth) return; const v=synth.getVoices(); voice=v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; } else document.body.classList.add("nosay");
function speak(text,onend){
  if(!synth) return;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US"; if(voice) u.voice=voice; u.rate=store.rate;
  if(onend) u.onend=onend;
  synth.speak(u);
}

/* training */
function pickVerb(){
  const pool=VERBS.filter(v=>!isMastered(v.b));
  const src=(pool.length&&Math.random()<0.8)?pool:VERBS;
  // quem você erra mais aparece mais
  const w=src.map(v=>{ const st=store.v[v.b]; return 1+(st?Math.min(st.w,5)*2:0); });
  const tot=w.reduce((a,b)=>a+b,0);
  let v=src[0];
  for(let t=0;t<10;t++){
    let r=Math.random()*tot;
    for(let k=0;k<src.length;k++){ r-=w[k]; if(r<=0){ v=src[k]; break; } }
    if(!state.cur||!state.cur.v||state.cur.v.b!==v.b||src.length<2) break;
  }
  return v;
}
function pickSentence(){
  if(Math.random()<0.65){ const p=pick(PHRASES); return {en:p.en,pt:p.pt}; }
  const v=pick(VERBS.filter(x=>x.b!=="give up")), i=Math.floor(Math.random()*3);
  return {en:v.en[i],pt:v.ptS[i]};
}
function nextQ(){
  const m=state.mode;
  if(m==="dict"||m==="speak"){
    let s=pickSentence(); if(state.cur&&state.cur.en===s.en) s=pickSentence();
    state.cur={kind:m,en:s.en,pt:s.pt,done:false,result:null,typed:"",shown:false,fresh:m==="dict",heard:null,score:0,html:"",listening:false,err:""};
    return;
  }
  if(m==="fix"||m==="fixw"){
    let src=ERRORS;
    if(state.ecat==="mine"){ const mine=ERRORS.filter(x=>store.e[x.id]&&store.e[x.id].w>store.e[x.id].c); if(mine.length) src=mine; }
    else if(state.ecat!=="all") src=ERRORS.filter(x=>x.cat===state.ecat);
    const w=src.map(x=>{ const s=store.e[x.id]; return 1+(s?Math.max(0,Math.min(s.w-s.c,4))*2:0)+(s?0:1); });
    const tot=w.reduce((a,b)=>a+b,0); let it=src[0];
    for(let t=0;t<10;t++){ let r=Math.random()*tot; for(let k=0;k<src.length;k++){ r-=w[k]; if(r<=0){ it=src[k]; break; } }
      if(!state.cur||!state.cur.it||state.cur.it.id!==it.id||src.length<2) break; }
    state.cur={kind:m,it,order:Math.random()<.5?[0,1]:[1,0],done:false,result:null,typed:"",shown:false};
    return;
  }
  const v=pickVerb();
  const i=m==="past"?1:Math.floor(Math.random()*3);
  const order=[0,1,2].sort(()=>Math.random()-.5);
  state.cur={kind:m,v,i,order,done:false,result:null,typed:""};
}
function grade(ok){
  const c=state.cur;
  if(c.it){ const s=store.e[c.it.id]||(store.e[c.it.id]={c:0,w:0}); if(ok) s.c++; else s.w++; }
  if(c.v){ const st=vs(c.v.b); if(ok){st.s++;st.c++;} else {st.s=0;st.w++;} }
  const L=dayLog(); L.a++; L.train=(L.train||0)+1; if(ok) L.ok=(L.ok||0)+1;
  c.done=true; c.result=ok; save();
}
/* compara a frase certa com o que foi escrito/falado, palavra por palavra */
const NUMW="zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty".split(" ");
const CONTR=[["i'm","i am"],["you're","you are"],["we're","we are"],["they're","they are"],["it's","it is"],["that's","that is"],["what's","what is"],["he's","he is"],["she's","she is"],["don't","do not"],["doesn't","does not"],["didn't","did not"],["won't","will not"],["can't","can not"],["cannot","can not"],["i'll","i will"],["you'll","you will"],["we'll","we will"],["let's","let us"],["i've","i have"],["isn't","is not"],["aren't","are not"],["wasn't","was not"]];
function canon(s){
  let t=" "+String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\d+/g,m=>NUMW[+m]||m).replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ")+" ";
  CONTR.forEach(([a,b])=>{ t=t.split(" "+a+" ").join(" "+b+" "); });
  return t.replace(/'/g,"").replace(/\s+/g," ").trim();
}
function diff(target,got){
  const have={}; canon(got).split(" ").forEach(w=>{ if(w) have[w]=(have[w]||0)+1; });
  const toks=target.split(" "); let hit=0;
  const html=toks.map(tok=>{
    const ws=canon(tok).split(" ").filter(Boolean);
    const ok=ws.length>0&&ws.every(w=>have[w]>0);
    if(ok){ ws.forEach(w=>have[w]--); hit++; }
    return ok||!ws.length?esc(tok):`<span class="miss">${esc(tok)}</span>`;
  }).join(" ");
  return {html,score:toks.length?hit/toks.length:0};
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
function startMic(){
  const c=state.cur; if(!SR||!c||c.listening) return;
  if(synth) synth.cancel();
  let rec; try{ rec=new SR(); }catch(e){ c.err="Não deu pra abrir o microfone neste navegador."; render(); return; }
  rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=3;
  c.listening=true; c.err=""; render();
  rec.onresult=e=>{
    const alts=e.results[0]; let best=null;
    for(let k=0;k<alts.length;k++){ const m=diff(c.en,alts[k].transcript); if(!best||m.score>best.score) best={...m,t:alts[k].transcript}; }
    if(!best) return;
    c.heard=best.t; c.score=best.score; c.html=best.html;
    if(!c.done) grade(best.score>=0.8);
  };
  rec.onerror=e=>{
    c.err=(e.error==="not-allowed"||e.error==="service-not-allowed")?"O microfone está bloqueado. Libere o microfone pra este site nas configurações do navegador."
      :e.error==="no-speech"?"Não ouvi nada. Toque em Falar e fale perto do celular.":"Não deu pra ouvir direito. Tente de novo.";
  };
  rec.onend=()=>{ c.listening=false; if(state.cur===c&&state.tab==="train") render(); };
  try{ rec.start(); }catch(e){ c.listening=false; render(); }
}
const MODES=[["past","Qual é o passado?"],["tense","Qual é o tempo?"],["write","Escreva em inglês"],["dict","Ditado"],["speak","Fale em voz alta"],["fix","Qual está certa?"],["fixw","Corrija a frase"]];

  <div class="section"><h3 class="sh">Hoje</h3><div class="nums">
    ${num(L.a||0,"atividades")}${num(L.ok||0,"acertos")}${num(L.cards||0,"cards")}
  </div></div>
  <div class="section"><h3 class="sh">Últimos 7 dias</h3>
    <div class="week">${days.map((d,k)=>{ const sc=secs[k]; const h=sc?Math.max(6,sc/mx*100):3;
      const cls=sc>=goal*60?"met":sc>0?"some":""; const wd=WD[new Date(d+"T12:00:00").getDay()];
      return `<div class="wk ${k===6?"today":""}"><em>${sc>=60?Math.floor(sc/60):""}</em><div class="barbox"><i class="${cls}" style="height:${h}%"></i></div><small>${wd}</small></div>`; }).join("")}</div>
    <p class="small">Minutos por dia. Verde = meta batida.</p></div>
  <div class="section"><h3 class="sh">Desde o começo</h3><div class="nums">
    ${num(fmtMin(total),"no total")}${num(trained,"dias treinados")}${num(bestStreak(),"melhor sequência")}${num(learnedCount(),"cards aprendidos")}
  </div></div>`;
}
function renderMore(){
  const row=(tab,ic,t,d,act)=>`<button class="mrow" ${act?`data-act="${act}"`:`data-tab="${tab}"`}><span class="ic">${ic}</span><span><b>${t}</b><span class="d">${d}</span></span><span class="go">${act?"":"›"}</span></button>`;
  view.innerHTML=`<h2>Mais</h2>
    <div class="menu">
      ${row("phrases","💬","Frases do dia a dia",PHRASES.length+" frases pra contar seu dia")}
      ${row("words","🔤","Palavras",WORDS.length+" palavras por categoria")}
      ${row("verbs","📚","Verbos",VERBS.length+" verbos nos 3 tempos")}
      ${row("texts","📖","Textos","Pra ler em voz alta")}
      ${row("rules","📏","Regras","As regras que mais caem")}
    </div>
    <div class="section"><h3 class="sh">Ajustes</h3><div class="menu">
      ${row("","🗣️","Velocidade da voz",store.rate<1?"Devagar · toque pra voz normal":"Normal · toque pra voz devagar","speed")}
    </div>
    <p class="small" style="margin:14px 0 6px">Meta diária</p>
    <div class="controls" style="margin:0">${[5,10,15,20,30].map(g=>`<button class="chip" aria-pressed="${store.goal===g}" data-goal="${g}">${g} min</button>`).join("")}</div></div>
    <div class="section"><h3 class="sh">Backup</h3>
      <p class="small" style="margin:0 0 10px">O progresso fica salvo neste celular. Salve um backup antes de trocar de aparelho ou limpar o navegador.</p>
      <div class="btns"><button class="btn ghost" data-act="export">Salvar backup</button><button class="btn ghost" data-act="import">Restaurar</button></div>
      <input type="file" id="importFile" accept="application/json,.json" hidden></div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(store)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`english-gym-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=="object"||(!d.v&&!d.log)) throw 0;
      Object.keys(store).forEach(k=>delete store[k]); Object.assign(store,fix(d)); save(); render();
      alert("Backup restaurado.");
    }catch(e){ alert("Esse arquivo não é um backup do English Gym."); }
  };
  r.readAsText(file);
}

/* flashcards */
const DECKS=[["phrases","Frases"],["words","Palavras"],["verbs","Verbos"]];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function cardItems(deck){
  if(deck==="verbs") return VERBS.map(v=>({id:"v:"+v.b,en:v.b,pt:v.pt,verb:v,say:`${v.pres}. ${v.pa}. will ${v.b}.`,cat:v.reg?"Regulares":"Irregulares"}));
  if(deck==="words") return WORDS.map(w=>({id:"w:"+w.en,en:w.en,pt:w.pt,say:w.en,cat:w.cat}));
  return PHRASES.map(p=>({id:"p:"+p.en,en:p.en,pt:p.pt,say:p.en,cat:p.cat}));
}
function deckFiltered(){ const f=state.fc; let it=cardItems(f.deck); if(f.cat!=="all") it=it.filter(x=>x.cat===f.cat); return it; }
function buildQueue(force){
  const f=state.fc, items=deckFiltered(), t=today();
  let q;
  if(force) q=shuffle(items).slice(0,15);
  else{
    const due=shuffle(items.filter(x=>store.cards[x.id]&&store.cards[x.id].d<=t)).slice(0,20);
    const fresh=shuffle(items.filter(x=>!store.cards[x.id])).slice(0,Math.max(0,Math.min(10,20-due.length)));
    q=due.concat(fresh);
  }
  Object.assign(f,{queue:q,idx:0,flip:false,right:0,wrong:0,retry:{}});
}
function answerCard(ok){
  const f=state.fc, it=f.queue[f.idx]; if(!it) return;
  const s=store.cards[it.id]||{b:0,d:today()};
  if(ok){ s.b=f.retry[it.id]?1:Math.min(s.b+1,5); s.d=addDays(today(),BOX_DAYS[s.b]); f.right++; }
  else { s.b=0; s.d=today(); f.wrong++; if(!f.retry[it.id]){ f.retry[it.id]=1; f.queue.push(it); } }
  store.cards[it.id]=s;
  const L=dayLog(); L.a++; L.cards=(L.cards||0)+1; if(ok) L.ok=(L.ok||0)+1;
  save(); f.idx++; f.flip=false;
}
function renderCards(){
  const f=state.fc; if(!f.queue) buildQueue(false);
  const items=deckFiltered(), t=today();
  const nDue=items.filter(x=>store.cards[x.id]&&store.cards[x.id].d<=t).length;
  const nNew=items.filter(x=>!store.cards[x.id]).length;
  const nLearn=items.filter(x=>store.cards[x.id]&&store.cards[x.id].b>=3).length;
  const cats=[...new Set(cardItems(f.deck).map(x=>x.cat))];
  let body;
  if(f.idx>=f.queue.length){
    body=`<div class="card"><p class="q-main sm">${f.queue.length?"Rodada concluída 💪":"Nada pra revisar agora neste baralho."}</p>
      ${f.queue.length?`<p>${f.right} acertos e ${f.wrong} erros. Os que você errou voltam amanhã; os que acertou voltam em alguns dias.</p>`:`<p class="hint">Os cards que você já acertou voltam nos próximos dias. Pode treinar mais agora se quiser.</p>`}
      <div class="btns">${nDue||nNew?`<button class="btn" data-act="cagain">Próxima rodada</button>`:""}<button class="btn ${nDue||nNew?"ghost":""}" data-act="cmore">Mais 15 cards aleatórios</button></div></div>`;
  } else {
    const it=f.queue[f.idx], ptFirst=f.dir==="pt", isNew=!store.cards[it.id];
    const front=ptFirst?it.pt:it.en, v=it.verb;
    const forms=v?`<div class="forms"><span class="c1"><small>presente</small>${esc(v.pres)}</span><span class="c2"><small>passado</small>${esc(v.pa)}</span><span class="c3"><small>futuro</small>will ${esc(v.b)}</span></div>`:"";
    body=`<div class="fc" data-act="flip" role="button" tabindex="0" aria-label="Virar card">
        <p class="q-label">${f.idx+1} de ${f.queue.length}${isNew?' <span class="tag">novo</span>':""}${f.retry[it.id]&&!isNew?' <span class="tag">de novo</span>':""}</p>
        <p class="fc-front">${esc(front)}</p>
        ${!ptFirst&&!f.flip?`<div>${sayBtn(it.say)}</div>`:""}
        ${f.flip?`<div class="fc-back"><p class="fc-en"><span>${esc(it.en)}</span>${sayBtn(it.say)}</p>${forms}<p class="ptx" style="margin:0">${esc(it.pt)}</p></div>`
          :`<p class="hint" style="margin-top:auto">Tente lembrar e toque pra virar</p>`}
      </div>
      <div class="btns" style="margin-top:12px">${f.flip
        ?`<button class="btn badb" data-act="cwrong">Errei</button><button class="btn okb" data-act="cright">Acertei</button>`
        :`<button class="btn" data-act="flip">Virar</button>`}</div>`;
  }
  view.innerHTML=`<h2>Flashcards</h2>
    <p class="hint">Lembre antes de virar. Errou, volta logo; acertou, volta em alguns dias.</p>
    <div class="controls">${DECKS.map(([k,n])=>`<button class="chip" aria-pressed="${f.deck===k}" data-deck="${k}">${n}</button>`).join("")}
</div>
    <div class="controls"><button class="chip" aria-pressed="${f.cat==="all"}" data-fccat="all">Todas</button>${cats.map(c=>`<button class="chip" aria-pressed="${f.cat===c}" data-fccat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="deckinfo"><span>${nDue} pra revisar · ${nNew} novos · ${nLearn} aprendidos</span><button class="dirbtn" data-dir="${f.dir==="pt"?"en":"pt"}" aria-label="Trocar direção">${f.dir==="pt"?"PT → EN":"EN → PT"} ⇄</button></div>
    ${body}`;
}

/* erros comuns */
function renderErrors(){
  const mine=ERRORS.filter(x=>store.e[x.id]&&store.e[x.id].w>store.e[x.id].c);
  const list=state.ecat==="mine"?mine:ERRORS.filter(x=>state.ecat==="all"||x.cat===state.ecat);
  let lastCat="";
  view.innerHTML=`<h2>Erros comuns de brasileiro</h2>
    <p class="hint">Frases que a gente entende, mas que saem erradas porque traduzimos do português. Leia a certa em voz alta.</p>
    <div class="controls"><button class="chip" aria-pressed="${state.ecat==="all"}" data-ecat="all">Todos</button>
      ${ERROR_CATS.map(c=>`<button class="chip" aria-pressed="${state.ecat===c}" data-ecat="${esc(c)}">${esc(c)}</button>`).join("")}
      <button class="chip t0" aria-pressed="${state.ecat==="mine"}" data-ecat="mine">Os que eu erro (${mine.length})</button></div>
    <div class="btns" style="margin:0 0 14px"><button class="btn" data-goto="train:fix">Treinar: qual está certa?</button><button class="btn ghost" data-goto="train:fixw">Treinar: corrija a frase</button></div>
    ${list.length?`<div class="rules">${list.map(it=>{
      const h=(state.ecat==="all"&&it.cat!==lastCat)?`<h3 class="cat-h">${esc(it.cat)}</h3>`:""; lastCat=it.cat;
      const s=store.e[it.id];
      return `${h}<section class="rule">
        <div class="ex no"><span class="mk" aria-label="Errado">✕</span><span class="t">${esc(it.bad)}</span></div>
        ${it.good.map(g=>`<div class="ex yes"><span class="mk" aria-label="Certo">✓</span><span class="t">${esc(g)}</span>${sayBtn(g)}</div>`).join("")}
        <p style="margin:8px 0 0">${esc(it.why)}${s?` <span class="small">(${s.c} acertos, ${s.w} erros)</span>`:""}</p></section>`;
    }).join("")}</div>`:`<div class="empty">${state.ecat==="mine"?"Nenhum erro marcado ainda. Faça o treino e os que você errar aparecem aqui.":"Nada aqui."}</div>`}`;
}

/* frases */
function filteredPhrases(){ const q=norm(state.pq); return PHRASES.filter(p=>(state.pcat==="all"||p.cat===state.pcat)&&(!q||norm(p.en+" "+p.pt).includes(q))); }
function renderPhrases(){
  const list=filteredPhrases(); let lastCat="";
  view.innerHTML=`<h2>Frases do dia a dia</h2>
    <p class="hint">Frases prontas pra contar o seu dia. Ouça, repita em voz alta e depois treine nos Flashcards. Na categoria Manhã elas estão na ordem do dia.</p>
    <div class="controls"><input class="search" type="search" placeholder="Buscar em inglês ou português" value="${esc(state.pq)}" data-search="pq" aria-label="Buscar frase"></div>
    <div class="controls"><button class="chip" aria-pressed="${state.pcat==="all"}" data-pcat="all">Todas</button>${PHRASE_CATS.map(c=>`<button class="chip" aria-pressed="${state.pcat===c}" data-pcat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="listenbar" style="margin:0 0 14px"><button class="btn" data-act="seq">▶ Ouvir em sequência</button><button class="btn ghost" data-act="stop">Parar</button></div>
    <div class="phr-list">${list.length?list.map((p,i)=>{
      const h=(state.pcat==="all"&&p.cat!==lastCat)?`<h3 class="cat-h">${esc(p.cat)}</h3>`:""; lastCat=p.cat;
      return `${h}<div class="phr" data-i="${i}"><div style="flex:1"><div class="en">${esc(p.en)}</div><div class="ptx">${esc(p.pt)}</div></div>${sayBtn(p.en)}</div>`;
    }).join(""):`<div class="empty">Nenhuma frase encontrada. Tente outra palavra.</div>`}</div>`;
}
function stopSeq(){ state.seqId++; document.querySelectorAll(".phr.speaking").forEach(x=>x.classList.remove("speaking")); }
function playSeq(){
  const list=filteredPhrases(); if(!list.length) return;
  const id=++state.seqId; let k=0; countAct("phrases");
  const step=()=>{
    document.querySelectorAll(".phr.speaking").forEach(x=>x.classList.remove("speaking"));
    if(id!==state.seqId||state.tab!=="phrases"||k>=list.length) return;
    const row=view.querySelector(`.phr[data-i="${k}"]`); if(row){ row.classList.add("speaking"); row.scrollIntoView({block:"nearest",behavior:"smooth"}); }
    speak(list[k].en,()=>{ if(id!==state.seqId) return; k++; setTimeout(step,700); });
  };
  step();
}

/* palavras */
function renderWords(){
  const q=norm(state.wq);
  const list=WORDS.filter(w=>(state.wcat==="all"||w.cat===state.wcat)&&(!q||norm(w.en+" "+w.pt).includes(q)));
  let lastCat="";
  view.innerHTML=`<h2>Palavras</h2>
    <p class="hint">Toque numa palavra pra ouvir. Esconda o português e tente lembrar antes de tocar.</p>
    <div class="controls"><input class="search" type="search" placeholder="Buscar em inglês ou português" value="${esc(state.wq)}" data-search="wq" aria-label="Buscar palavra">
      <button class="chip t0" aria-pressed="${state.whide}" data-act="whide">${state.whide?"Mostrar português":"Esconder português"}</button></div>
    <div class="controls"><button class="chip" aria-pressed="${state.wcat==="all"}" data-wcat="all">Todas</button>${WORD_CATS.map(c=>`<button class="chip" aria-pressed="${state.wcat===c}" data-wcat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    ${list.length?"":`<div class="empty">Nenhuma palavra encontrada. Tente outra.</div>`}
    ${list.map(w=>{
      let h=""; if(w.cat!==lastCat){ h=(lastCat?"</div>":"")+(state.wcat==="all"?`<h3 class="cat-h">${esc(w.cat)}</h3>`:"")+`<div class="wgrid">`; lastCat=w.cat; }
      const masked=state.whide&&!state.wrev.has(w.en);
      return `${h}<button class="wd" data-word="${esc(w.en)}"><b>${esc(w.en)}</b><span>${masked?'<span class="masked"></span>':esc(w.pt)}</span></button>`;
    }).join("")}${list.length?"</div>":""}`;
}

/* tempo ativo: conta só com o app aberto e em uso (sem mexer por 90s, para de contar) */
let lastAct=Date.now(), tick=0;
["pointerdown","keydown","input","scroll","touchstart"].forEach(ev=>window.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true,capture:true}));
setInterval(()=>{
  if(document.visibilityState!=="visible") return;
  if(synth&&synth.speaking) lastAct=Date.now();
  if(Date.now()-lastAct>90000) return;
  dayLog().sec+=5; tick++;
  if(tick%6===0){ save(); renderStats(); }
},5000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") save(); });

/* ---------- EVENTS ---------- */
function goTab(t){ state.tab=t; stopSeq(); if(synth) synth.cancel(); render(); window.scrollTo({top:0}); }
document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-say],[data-act]");
  if(!el||el.tagName==="INPUT") return;
  const d=el.dataset;
  if(d.say){
    stopSeq();
    if(el.classList.contains("w")){
      document.querySelectorAll(".w.speaking").forEach(x=>x.classList.remove("speaking"));
      el.classList.add("speaking"); speak(d.say,()=>el.classList.remove("speaking"));
    } else speak(d.say);
    if(d.count) countAct(d.count);
    return;
  }
  if(d.slow){ const r=store.rate; store.rate=0.6; speak(d.slow); store.rate=r; return; }
  if(d.word){ speak(d.word); if(state.whide&&!state.wrev.has(d.word)){ state.wrev.add(d.word); render(); } return; }
  if(d.tab){ goTab(d.tab); return; }
  if(d.goto){ const [t,m]=d.goto.split(":"); if(m){ state.mode=m; state.cur=null; } goTab(t); return; }
  if(d.filter){ state.filter=d.filter; render(); return; }
  if(d.open!==undefined){ state.open=state.open===d.open?null:d.open; render(); return; }
  if(d.mode){ state.mode=d.mode; state.cur=null; if(synth) synth.cancel(); render(); return; }
  if(d.text){ state.text=+d.text; render(); return; }
  if(d.tense){ state.tense=+d.tense; render(); return; }
  if(d.deck){ state.fc.deck=d.deck; state.fc.cat="all"; state.fc.queue=null; render(); return; }
  if(d.fccat){ state.fc.cat=d.fccat; state.fc.queue=null; render(); return; }
  if(d.dir){ state.fc.dir=d.dir; state.fc.flip=false; render(); return; }
  if(d.pcat){ state.pcat=d.pcat; stopSeq(); if(synth) synth.cancel(); render(); return; }
  if(d.ecat){ state.ecat=d.ecat; if(state.cur&&(state.cur.kind==="fix"||state.cur.kind==="fixw")) state.cur=null; render(); return; }
  if(d.eopt!==undefined){ const c=state.cur; if(!c||c.done) return; c.chosen=+d.eopt; grade(c.chosen===1); render(); return; }
  if(d.wcat){ state.wcat=d.wcat; render(); return; }
  if(d.goal){ store.goal=+d.goal; save(); render(); return; }
  if(d.opt!==undefined){ const c=state.cur; if(c.done) return; c.chosen=+d.opt; grade(c.chosen===c.i); render(); return; }
  const c=state.cur, f=state.fc;
  switch(d.act){
    case "speed": store.rate=store.rate<1?1:0.75; save(); render(); break;
    case "hide": state.hide=!state.hide; render(); break;
    case "stop": stopSeq(); if(synth) synth.cancel(); break;
    case "pt": state.showPT=!state.showPT; render(); break;
    case "check": { const a=document.getElementById("ans"); c.typed=a.value; if(!norm(c.typed)){a.focus();return;} grade(norm(c.typed)===norm(c.v.pa)); render(); break; }
    case "skip": c.typed=""; grade(false); render(); break;
    case "reveal": { const a=document.getElementById("ans"); c.typed=a.value;
      if(canon(c.typed)===canon(c.v.en[c.i])) grade(true); else c.shown=true; render(); break; }
    case "dcheck": { const a=document.getElementById("ans"); c.typed=a.value; if(!canon(c.typed)){a.focus();return;}
      if(canon(c.typed)===canon(c.en)) grade(true); else c.shown=true; render(); break; }
    case "fcheck": { const a=document.getElementById("ans"); c.typed=a.value; if(!canon(c.typed)){a.focus();return;}
      if(c.it.good.some(g=>canon(g)===canon(c.typed))) grade(true); else c.shown=true; render(); break; }
    case "dskip": c.typed=""; grade(false); render(); break;
    case "self-ok": grade(true); render(); break;
    case "self-bad": grade(false); render(); break;
    case "next": nextQ(); render(); break;
    case "mic": startMic(); break;
    case "flip": if(f.queue&&f.queue[f.idx]&&!f.flip){ f.flip=true; speak(f.queue[f.idx].say); render(); } break;
    case "cright": answerCard(true); render(); break;
    case "cwrong": answerCard(false); render(); break;
    case "cmore": buildQueue(true); render(); break;
    case "cagain": buildQueue(false); render(); break;
    case "seq": playSeq(); break;
    case "whide": state.whide=!state.whide; state.wrev=new Set(); render(); break;
    case "export": exportData(); break;
    case "import": document.getElementById("importFile").click(); break;
  }
});
document.addEventListener("change",e=>{ if(e.target.id==="importFile") importData(e.target.files[0]); });
document.addEventListener("input",e=>{
  const key=e.target.dataset.search;
  if(key){ state[key]=e.target.value; const pos=e.target.selectionStart; render(); const s=view.querySelector(`[data-search="${key}"]`); if(s){ s.focus(); s.setSelectionRange(pos,pos); } }
  if(e.target.id==="ans"&&state.cur) state.cur.typed=e.target.value;
});
document.addEventListener("keydown",e=>{
  if(state.tab==="cards"&&e.target.tagName!=="INPUT"){
    const f=state.fc; if(!f.queue||!f.queue[f.idx]) return;
    if(!f.flip&&(e.key===" "||e.key==="Enter")){ e.preventDefault(); f.flip=true; speak(f.queue[f.idx].say); render(); return; }
    if(f.flip&&e.key==="1"){ answerCard(false); render(); return; }
    if(f.flip&&e.key==="2"){ answerCard(true); render(); return; }
    return;
  }
  if(e.key!=="Enter"||state.tab!=="train") return;
  const c=state.cur; if(!c) return;
  if(c.done){ e.preventDefault(); nextQ(); render(); return; }
  if(e.target.id==="ans"){ e.preventDefault(); const b=view.querySelector('[data-act="check"],[data-act="reveal"],[data-act="dcheck"],[data-act="fcheck"]'); if(b) b.click(); }
});

render();
if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
